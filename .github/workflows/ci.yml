# goal: Build the image for myportfolio push to deocker hub
# goal: Build the image for devboard fronted and push to deocker hub
name: CI

on:
 push:
   branches: [main]

jobs:
  code-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # ESLint and Prettier must be in `package.json`
      - name: Install Node.js dependencies
        run: npm ci

      - name:  install prettier 
        run:   npm install --save-dev prettier
      - name: install linter
        run: npm install -D eslint @eslint/js globals
      - name: Run linters
        uses: wearerequired/lint-action@v3
        with:
          eslint: true
          prettier: true
  build_and_push:
   needs: [code-lint]
   runs-on: ubuntu-latest
   steps:
     - name: checkout code
       uses: actions/checkout@v6

     - name: Docker Setup [Login}
       uses: docker/login-action@v4
       with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
     - name: Docker Build and push
       uses: docker/build-push-action@v7
       with:
         file: ./Dockerfile
         push: true
         tags: ${{ vars.DOCKERHUB_USERNAME }}/my-portfolio-main:latest
     
